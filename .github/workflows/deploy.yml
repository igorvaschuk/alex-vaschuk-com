name: Deploy Alex’s website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: alex-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/1059072294008/locations/global/workloadIdentityPools/github/providers/alex-repo
          service_account: alex-deployer@vaschuk-com.iam.gserviceaccount.com
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Firebase access
        run: npx --yes firebase-tools@15.34.2 hosting:sites:list --project vaschuk-com --json
      - name: Require curated artwork before publishing
        run: node scripts/check-content.cjs
      - name: Deploy to Firebase Hosting
        run: npx --yes firebase-tools@15.34.2 deploy --only hosting --project vaschuk-com --non-interactive
